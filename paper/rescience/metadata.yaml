abstract: "EchoGAE (Alatawi, Sheth and Liu, 2023) trains a graph autoencoder on a Twitter retweet graph and reports an Echo Chamber Score (ECS) per topic. The paper's Equation 4 averages community scores; the released notebook averages user scores. On graphs with unequal community sizes these are different numbers, and both circulate as the ECS. We pin the release to commit 0626330, regenerate text features with Sentence-BERT revision 1110a243, cross ten Louvain seeds with ten model-fitting seeds, and compute both averages on the same fitted representations. On SXSW ten fits give a user-average score of 0.467 (within one seed standard deviation of the published 0.465) and a community-average score of 0.655. Across the four topics the polarising-minus-non-polarising contrast is +0.131 under the code's rule and +0.036 under the paper's, reversing in 22 of 90 defined seed configurations under the second. The reproduction succeeds under the released code's rule, documents a definitional ambiguity between the published equation and the released implementation, and recommends reporting the averaging unit alongside any cross-topic ECS value."

